global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout queue 5s
    timeout check 3s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend public
    bind :8000
    default_backend agents

backend agents
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server-template agent 1-10 shopping-agent:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr none resolve-prefer ipv4 maxconn 32 maxqueue 64
