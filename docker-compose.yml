services:
  shopping-agent:
    image: multimodal-shopping-agent:local
    build:
      context: .
      args:
        INSTALL_EXTRAS: redis
    expose:
      - "8000"
    environment:
      RETRIEVER_BACKEND: baseline
      CATALOG_PATH: /app/data/products.jsonl
      # 阶段二：会话状态外置。设成 redis 之后本服务就是无状态的，
      # 副本可以随意增减、滚动发布不会丢会话。
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      SESSION_TTL_SECONDS: "3600"
      CONTEXT_BUDGET: "2048"
      MAX_STEPS: "6"
      AUTH_MODE: ${AUTH_MODE:-demo}
      API_KEYS_JSON: ${API_KEYS_JSON:-}
      INVENTORY_BACKEND: ${INVENTORY_BACKEND:-catalog}
      INVENTORY_BASE_URL: ${INVENTORY_BASE_URL:-}
      INVENTORY_API_KEY: ${INVENTORY_API_KEY:-}
      INVENTORY_TIMEOUT_SECONDS: ${INVENTORY_TIMEOUT_SECONDS:-3}
      INVENTORY_MAX_AGE_SECONDS: ${INVENTORY_MAX_AGE_SECONDS:-30}
      REASONER_BACKEND: ${REASONER_BACKEND:-rule}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-8192}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: haproxy:3.0-alpine
    ports:
      - "8010:8000"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - shopping-agent
    restart: unless-stopped

  # 水平扩容时再起一个副本，验证"无状态服务 + 共享会话"确实成立：
  #   docker compose up --scale shopping-agent=3
  # 之后用同一个 session_id 连续请求 8010 端口，会话不会碎。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # 会话是"丢了就丢一轮对话"的短生命周期数据，不需要持久化；
    # 真要持久化就把 --appendonly 打开并挂 volume。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

