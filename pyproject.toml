[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-shopping-agent"
version = "0.1.0"
description = "CPU-first multimodal RAG shopping agent with tool calling and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]
clip = ["torch>=2.3,<3", "transformers>=4.46,<5"]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
