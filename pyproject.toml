[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-shopping-agent"
version = "0.1.0"
description = "Reproducible multimodal content-understanding agent: shared-space image-text retrieval, schema-constrained tool orchestration and grounded generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mcp>=2.3,<3", "pytest>=8,<9", "pytest-cov>=5,<7", "psutil>=5.9,<8"]
mcp = ["mcp>=2.3,<3"]
# transformers >= 4.52 会拒绝 torch.load 加载 .bin 权重（CVE-2025-32434 防护，要求 torch >= 2.6），
# 而 Chinese-CLIP 权重只有 .bin 格式。torch 2.3~2.5 + transformers 4.51 实测可正常编码。
clip = ["torch>=2.3,<3", "transformers>=4.46,<4.52"]
# 规模化：近似最近邻索引。faiss-cpu 是可选依赖，缺失时自动退回 numpy 精确检索。
ann = ["faiss-cpu>=1.8,<2"]
# 多副本部署：会话外置到 Redis。
redis = ["redis>=5,<7"]
service = ["httpx>=0.27,<1", "redis>=5,<7"]
# 一次性装齐"能跑大规模 + 能水平扩展"
scale = [
  "faiss-cpu>=1.8,<2",
  "redis>=5,<7",
  "torch>=2.3,<3",
  "transformers>=4.46,<4.52",
]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"
shopping-agent-mcp = "shopping_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopping_agent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

