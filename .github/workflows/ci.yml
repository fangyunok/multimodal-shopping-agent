name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,ann,redis]"
      # scripts/ 下的压测脚本不进包，但测试会用 importlib 按路径加载它们，
      # 所以它们必须和包一起做语法检查。开发机常在 3.12+ 上跑，
      # 而 f-string 嵌套引号（PEP 701）要 3.12+ 才合法——本地全绿、CI（3.11）语法报错
      # 这种坑只靠线上报错发现太慢，这一步把它提前到提交前。
      - run: python -m compileall -q scripts tests src/shopping_agent
      - run: python -m pytest --cov=shopping_agent --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: INSTALL_EXTRAS=redis
          tags: multimodal-shopping-agent:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start isolated multi-replica stack
        run: docker compose -p stability-ci up --no-build -d --scale shopping-agent=3
      - name: Verify sessions, readiness and recovery
        env:
          COMPOSE_PROJECT_NAME: stability-ci
        run: python scripts/smoke_compose.py --replicas 3
      - name: Show container logs on failure
        if: failure()
        run: docker compose -p stability-ci logs --no-color
      - name: Remove isolated test stack
        if: always()
        run: docker compose -p stability-ci down --volumes --remove-orphans

